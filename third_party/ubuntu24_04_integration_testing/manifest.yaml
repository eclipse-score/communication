version: 1
sources:
  - channel: noble main universe
    url: https://snapshot.ubuntu.com/ubuntu/20260401T104001Z
  - channel: noble-security main universe
    url: https://snapshot.ubuntu.com/ubuntu/20260401T104001Z
  - channel: noble-updates main universe
    url: https://snapshot.ubuntu.com/ubuntu/20260401T104001Z
archs:
  - amd64
  - arm64
packages:
  - base-files  # mergedusr symlinks
  - bash  # Required as default entrypoint of Docker
  - binutils  # provides addr2line, required for backtraces in sanitizers
  - coreutils  # for commands like `ls`
  - dash  # Framework expects /bin/sh, which on Ubuntu is provided by dash
  - libatomic1  # Dynamically linked at runtime to test executables
  - libstdc++6  # Dynamically linked at runtime to test executables
