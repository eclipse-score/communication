# Workflow configuration for automated release process
# This workflow is triggered manually via workflow_dispatch and expects a release tag input.
# It creates a draft release, runs all tests, and either leaves or removes the draft release based on results.

name: Automated Release Process
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create (example: v1.2.3)"
        required: true
        type: string

env:
  ANDROID_HOME: ""
  ANDROID_SDK_ROOT: ""
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-draft-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.create-release.outputs.id }}
      release-url: ${{ steps.create-release.outputs.url }}
      release-tag: ${{ steps.release-tag.outputs.release-tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set release tag from workflow dispatch input
        id: release-tag
        run: |
          echo "Release version tag: ${{ github.event.inputs.release_tag }}"
          echo "release-tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT

      - name: Create draft release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.release-tag }}
          name: ${{ steps.release-tag.outputs.release-tag }}
          body_path: .github/RELEASE_TEMPLATE.md
          draft: true
          prerelease: false
          target_commitish: ${{ github.sha }}

  run-host-quality:
    needs: create-draft-release
    uses: ./.github/workflows/build_and_test_host.yml
    with:
      cache-mode: read-only
    permissions:
      contents: read
      actions: write
    secrets:
      UBUNTU_SNAPSHOT_MIRROR_URL: ${{ secrets.UBUNTU_SNAPSHOT_MIRROR_URL }}

  run-build-and-test-qnx:
    needs: create-draft-release
    uses: ./.github/workflows/build_and_test_qnx.yml
    with:
      cache_mode: read-only
    permissions:
      contents: read
      pull-requests: read
      actions: write
    secrets:
      SCORE_QNX_LICENSE: ${{ secrets.SCORE_QNX_LICENSE }}
      SCORE_QNX_USER: ${{ secrets.SCORE_QNX_USER }}
      SCORE_QNX_PASSWORD: ${{ secrets.SCORE_QNX_PASSWORD }}
      UBUNTU_SNAPSHOT_MIRROR_URL: ${{ secrets.UBUNTU_SNAPSHOT_MIRROR_URL }}

  run-coverage-report:
    needs: create-draft-release
    uses: ./.github/workflows/_coverage_report.yml
    with:
      cache-mode: read-only
    permissions:
      contents: read
      actions: write
    secrets:
      UBUNTU_SNAPSHOT_MIRROR_URL: ${{ secrets.UBUNTU_SNAPSHOT_MIRROR_URL }}

  run-clang-tidy:
    needs: create-draft-release
    uses: ./.github/workflows/_clang_tidy.yml
    with:
      cache-mode: read-only
    permissions:
      contents: read
      actions: write
    secrets:
      UBUNTU_SNAPSHOT_MIRROR_URL: ${{ secrets.UBUNTU_SNAPSHOT_MIRROR_URL }}

  run-codeql:
    needs: create-draft-release
    uses: ./.github/workflows/_codeql.yml
    with:
      cache-mode: read-only
    permissions:
      contents: read
      actions: write
      security-events: write
    secrets:
      UBUNTU_SNAPSHOT_MIRROR_URL: ${{ secrets.UBUNTU_SNAPSHOT_MIRROR_URL }}

  run-docs-build:
    needs: create-draft-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Bazel
        uses: ./.github/actions/00_infrastructure/prepare_bazel_environment
        with:
          disk-cache: build_docs
          cache-mode: read-only
          ubuntu-snapshot-mirror-url: ${{ secrets.UBUNTU_SNAPSHOT_MIRROR_URL }}

      - name: Build and package Sphinx documentation
        uses: ./.github/actions/10_docs/build_sphinx_package
        with:
          docs-version: ${{ needs.create-draft-release.outputs.release-tag }}
          docs-base-url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          lobster-source-root: https://github.com/${{ github.repository }}/blob/main/
          repository-name: ${{ github.event.repository.name }}
          output-dir: docs_output
          archive-name: docs-${{ needs.create-draft-release.outputs.release-tag }}.tar.gz

      - name: Upload docs archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}_docs_release_${{ needs.create-draft-release.outputs.release-tag }}
          path: docs-${{ needs.create-draft-release.outputs.release-tag }}.tar.gz

  upload-coverage-report:
    needs:
      - create-draft-release
      - run-coverage-report
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Abort if coverage failed
        if: needs.run-coverage-report.result != 'success'
        run: |
          echo "::error::Coverage failed — aborting release. Draft will be deleted."
          exit 1

      - name: Download coverage report artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}_coverage_report_${{ github.sha }}
          path: ./

      - name: Upload coverage report to existing draft release
        run: |
          VERSION="${{ needs.create-draft-release.outputs.release-tag }}"
          REPO_NAME="${{ github.event.repository.name }}"
          mv "${REPO_NAME}_coverage_report_${{ github.sha }}.zip" "${REPO_NAME}_coverage_report_${VERSION}.zip"
          gh release upload "${VERSION}" "${REPO_NAME}_coverage_report_${VERSION}.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-clang-tidy-report:
    needs:
      - create-draft-release
      - run-clang-tidy
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Abort if clang-tidy failed
        if: needs.run-clang-tidy.result != 'success'
        run: |
          echo "::error::Clang-Tidy failed — aborting release. Draft will be deleted."
          exit 1

      - name: Download clang-tidy findings artifact
        uses: actions/download-artifact@v4
        with:
          name: clang-tidy-findings
          path: ./clang_tidy_report

      - name: Package and upload clang-tidy report to existing draft release
        run: |
          VERSION="${{ needs.create-draft-release.outputs.release-tag }}"
          REPO_NAME="${{ github.event.repository.name }}"
          ARCHIVE="${REPO_NAME}_clang_tidy_report_${VERSION}.zip"
          (cd clang_tidy_report && zip -r "../${ARCHIVE}" .)
          gh release upload "${VERSION}" "${ARCHIVE}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-codeql-report:
    needs:
      - create-draft-release
      - run-codeql
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Abort if CodeQL failed
        if: needs.run-codeql.result != 'success'
        run: |
          echo "::error::CodeQL failed — aborting release. Draft will be deleted."
          exit 1

      - name: Download CodeQL SARIF findings artifact
        uses: actions/download-artifact@v4
        with:
          name: codeql-sarif-results
          path: ./codeql_report

      - name: Download CodeQL MISRA reports artifact
        uses: actions/download-artifact@v4
        with:
          name: codeql-misra-reports
          path: ./codeql_report

      - name: Package and upload CodeQL report to existing draft release
        run: |
          VERSION="${{ needs.create-draft-release.outputs.release-tag }}"
          REPO_NAME="${{ github.event.repository.name }}"
          ARCHIVE="${REPO_NAME}_codeql_report_${VERSION}.zip"
          (cd codeql_report && zip -r "../${ARCHIVE}" .)
          gh release upload "${VERSION}" "${ARCHIVE}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-dashboard-report:
    needs:
      - create-draft-release
      - run-coverage-report
      - run-clang-tidy
      - run-codeql
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Abort if any quality job failed
        if: needs.run-coverage-report.result != 'success' || needs.run-clang-tidy.result != 'success' || needs.run-codeql.result != 'success'
        run: |
          echo "::error::A quality job failed — aborting release. Draft will be deleted."
          exit 1

      - name: Set up Bazel
        uses: ./.github/actions/00_infrastructure/prepare_bazel_environment
        with:
          disk-cache: ""
          cache-mode: read-only
          ubuntu-snapshot-mirror-url: ${{ secrets.UBUNTU_SNAPSHOT_MIRROR_URL }}

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}_coverage_report_${{ github.sha }}
          path: /tmp/coverage_zip

      - name: Extract coverage report
        run: |
          bash quality/scripts/extract_coverage_artifact.sh \
            /tmp/coverage_zip \
            "${GITHUB_WORKSPACE}/_quality/coverage"

      - name: Download clang-tidy findings
        uses: actions/download-artifact@v4
        with:
          name: clang-tidy-findings
          path: /tmp/clang_tidy

      - name: Download CodeQL SARIF artifact
        uses: actions/download-artifact@v4
        with:
          name: codeql-sarif-results
          path: /tmp/codeql

      - name: Prepare CodeQL findings for dashboard
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/_quality"
          if [[ -f /tmp/codeql/codeql-nightly.sarif ]]; then
            cp /tmp/codeql/codeql-nightly.sarif \
               "${GITHUB_WORKSPACE}/_quality/codeql_findings.sarif"
          fi

      - name: Generate quality dashboard
        run: |
          bazel run --config=ci //quality/dashboard:generate_dashboard -- \
            --lcov     /tmp/coverage_zip/extracted/artifacts/coverage_report.dat \
            --clang-tidy /tmp/clang_tidy/clang_tidy_findings.txt \
            --codeql "${GITHUB_WORKSPACE}/_quality/codeql_findings.sarif" \
            --html     "${GITHUB_WORKSPACE}/_dashboard/index.html"

      - name: Package and upload quality dashboard to existing draft release
        run: |
          VERSION="${{ needs.create-draft-release.outputs.release-tag }}"
          REPO_NAME="${{ github.event.repository.name }}"
          ARCHIVE="${REPO_NAME}_quality_dashboard_${VERSION}.zip"
          (cd _dashboard && zip -r "../${ARCHIVE}" .)
          gh release upload "${VERSION}" "${ARCHIVE}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-docs-report:
    needs:
      - create-draft-release
      - run-docs-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Abort if docs build failed
        if: needs.run-docs-build.result != 'success'
        run: |
          echo "::error::Documentation build failed — aborting release. Draft will be deleted."
          exit 1

      - name: Download docs archive artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}_docs_release_${{ needs.create-draft-release.outputs.release-tag }}
          path: ./

      - name: Upload docs archive to existing draft release
        run: |
          gh release upload "${{ needs.create-draft-release.outputs.release-tag }}" "docs-${{ needs.create-draft-release.outputs.release-tag }}.tar.gz" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize-release:
    runs-on: ubuntu-24.04
    needs:
      - create-draft-release
      - run-host-quality
      - run-build-and-test-qnx
      - run-coverage-report
      - run-clang-tidy
      - run-codeql
      - run-docs-build
      - upload-coverage-report
      - upload-clang-tidy-report
      - upload-codeql-report
      - upload-dashboard-report
      - upload-docs-report
    if: ${{ success() }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Report success
        run: |
          echo "All workflows succeeded. Draft release ${{ needs.create-draft-release.outputs.release-tag }} is ready for manual publishing."

  delete-release-on-failure:
    runs-on: ubuntu-24.04
    needs:
      - create-draft-release
      - run-host-quality
      - run-build-and-test-qnx
      - run-coverage-report
      - run-clang-tidy
      - run-codeql
      - run-docs-build
      - upload-coverage-report
      - upload-clang-tidy-report
      - upload-codeql-report
      - upload-dashboard-report
      - upload-docs-report
    if: ${{ failure() || cancelled() }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Delete draft release due to failure
        run: |
          gh release delete ${{ needs.create-draft-release.outputs.release-tag }} --yes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report failure
        run: |
          echo "One or more workflows failed. Draft release has been deleted."
          exit 1
