# Publishes the overview of pull requests needing an action (see tools/pr-state)
# into the pinned issue "PR overview". Writes only if the repository variable
# PR_STATE_ENABLED is 'true', otherwise the digest is printed to the log.

name: PR overview digest

on:
  schedule:
    - cron: "30 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  digest:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Publish digest
        env:
          REPO: ${{ github.repository }}
          ENABLED: ${{ vars.PR_STATE_ENABLED }}
        run: |
          args=(--repo "${REPO}")
          [ "${ENABLED}" = "true" ] || args+=(--dry-run)
          python3 tools/pr-state/pr_digest.py "${args[@]}"
