# Postprocessing steps that run once a release has been published.
# Currently: add the new release version to the "Affected Version" dropdown of
# the bug report issue template (via a pull request).

name: Release Postprocessing

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-issue-template-versions:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Populate version dropdown with published releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 1000 --exclude-drafts --json tagName --jq '.[].tagName' > releases.txt
          python3 - <<'EOF'
          import re

          FORM = ".github/ISSUE_TEMPLATE/1-bugfix.yml"

          def key(tag):
              return [int(n) for n in re.findall(r"\d+", tag)]

          with open("releases.txt") as f:
              tags = sorted({t.strip() for t in f if t.strip()}, key=key, reverse=True)
          if not tags:
              raise SystemExit("No published releases found")

          with open(FORM) as f:
              lines = f.read().split("\n")

          start = next(i for i, l in enumerate(lines) if re.match(r"\s*id:\s*_version\s*$", l))
          opt = next(i for i in range(start, len(lines)) if re.match(r"\s*options:\s*$", lines[i]))
          first = opt + 1
          end = first
          while end < len(lines) and re.match(r"\s*-\s", lines[end]):
              end += 1
          indent = re.match(r"\s*", lines[first]).group(0)
          lines[first:end] = [f"{indent}- {t}" for t in tags]

          with open(FORM, "w") as f:
              f.write("\n".join(lines))
          EOF
          rm releases.txt

      - name: Prepare Bazel environment
        uses: ./.github/actions/00_infrastructure/prepare_bazel_environment
        with:
          ubuntu-snapshot-mirror-url: ${{ secrets.UBUNTU_SNAPSHOT_MIRROR_URL }}

      - name: Reformat YAML files
        run: bazel run //:format_YAML_with_yamlfmt

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-issue-template-versions
          base: ${{ github.event.repository.default_branch }}
          commit-message: "chore: add released version to issue template"
          title: "chore: add released version to issue template"
          body: |
            Automatically adds the newly published release to the "Affected Version"
            dropdown of `.github/ISSUE_TEMPLATE/1-bugfix.yml`.

            Triggered by workflow `Release Postprocessing`.
          add-paths: .github/ISSUE_TEMPLATE/1-bugfix.yml
          delete-branch: true
