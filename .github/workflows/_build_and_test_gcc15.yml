name: "Build & Test (Host)"

on:
  workflow_call:
    inputs:
      cache-mode:
        description: "Cache mode override (empty = auto-compute from event context)."
        type: string
        default: ""
      fetch-only:
        description: "When true, runs --nobuild to fetch dependencies only."
        type: string
        default: "false"
    secrets:
      UBUNTU_SNAPSHOT_MIRROR_URL:
        required: false

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/00_infrastructure/prepare_bazel_environment
        with:
          disk-cache: ${{ inputs.fetch-only != 'true' && 'build_and_test_host' || '' }}
          cache-mode: ${{ inputs.cache-mode }}
          ubuntu-snapshot-mirror-url: ${{ secrets.UBUNTU_SNAPSHOT_MIRROR_URL }}

      - name: Build all targets
        if: inputs.fetch-only != 'true'
        run: bazel build --config=ci //...

      - name: Run all tests
        if: inputs.fetch-only != 'true'
        id: run-tests
        run: bazel test --config=ci //... --build_tests_only

      - name: Upload failed Bazel test logs
        if: inputs.fetch-only != 'true' && failure() && steps.run-tests.outcome == 'failure'
        uses: ./.github/actions/00_infrastructure/upload_bazel_testlogs_on_failure
        with:
          artifact-name: bazel-testlogs-gcc15

      # Same commands with all experimental features activated, see CI.md#feature-flags.
      # Runs in the same job to reuse the Bazel disk cache.
      - name: Build all targets (all experimental features)
        if: inputs.fetch-only != 'true'
        run: bazel build --config=ci --config=activate_all_experimental_features //...

      - name: Run all tests (all experimental features)
        if: inputs.fetch-only != 'true'
        id: run-tests-experimental
        run: bazel test --config=ci --config=activate_all_experimental_features //... --build_tests_only

      - name: Upload failed Bazel test logs (all experimental features)
        if: inputs.fetch-only != 'true' && failure() && steps.run-tests-experimental.outcome == 'failure'
        uses: ./.github/actions/00_infrastructure/upload_bazel_testlogs_on_failure
        with:
          artifact-name: bazel-testlogs-gcc15-experimental

      - name: Build module_integration_test
        if: inputs.fetch-only != 'true'
        run: cd module_integration_test && bazel build //... && bazel mod deps --lockfile_mode=update

      - name: Fetch dependencies (--nobuild)
        if: inputs.fetch-only == 'true'
        run: |-
          bazel build --nobuild --config=ci //...
          bazel build --nobuild --config=ci --config=activate_all_experimental_features //...
          cd module_integration_test && bazel build --nobuild //...
