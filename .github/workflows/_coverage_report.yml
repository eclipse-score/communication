name: "Coverage Report"

on:
  workflow_call:
    inputs:
      cache-mode:
        description: "Cache mode override (empty = auto-compute from event context)."
        type: string
        default: ""
      fetch-only:
        description: "When true, runs --nobuild to fetch dependencies only."
        type: string
        default: "false"
    secrets:
      UBUNTU_SNAPSHOT_MIRROR_URL:
        required: false
      SCORE_QNX_LICENSE:
        required: false
      SCORE_QNX_USER:
        required: false
      SCORE_QNX_PASSWORD:
        required: false

jobs:
  coverage-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: ./.github/actions/00_infrastructure/prepare_bazel_environment
        with:
          disk-cache: ${{ inputs.fetch-only != 'true' && 'coverage_report' || '' }}
          cache-mode: ${{ inputs.cache-mode }}
          ubuntu-snapshot-mirror-url: ${{ secrets.UBUNTU_SNAPSHOT_MIRROR_URL }}

      - name: Fetch dependencies (--nobuild)
        if: inputs.fetch-only == 'true'
        run: bazel build --nobuild --config=ci //...

      - name: Run coverage
        if: inputs.fetch-only != 'true'
        id: run-coverage
        run: bazel coverage --config=ci //... --build_tests_only

      - name: Generate coverage report
        if: inputs.fetch-only != 'true' && steps.run-coverage.outcome == 'success'
        id: generate-report
        run: |
          bazel run --config=ci @score_coverage//:generate_coverage_html -- \
            --yaml quality/coverage/coverage_justifications.yaml \
            --testlogs-subdir score \
            --archive "${{ github.event.repository.name }}_coverage_report_${{ github.sha }}" \
            cpp_coverage_linux
        env:
          # Report-only: the effective-coverage gate is not enforced yet.
          COVERAGE_THRESHOLD: "0"

      - name: Upload coverage artifacts
        if: inputs.fetch-only != 'true' && steps.generate-report.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}_coverage_report_${{ github.sha }}
          path: ${{ github.event.repository.name }}_coverage_report_${{ github.sha }}.zip

  # Whether to additionally collect the --config=qnx coverage is derived
  # automatically from secret availability rather than a caller-supplied
  # flag: it only runs when the QNX license secret has actually been
  # provided (e.g. not forwarded by cache-warming callers).
  determine-qnx:
    name: Determine QNX availability
    runs-on: ubuntu-24.04
    outputs:
      available: ${{ steps.qnx.outputs.available }}
    steps:
      - id: qnx
        run: |
          if [[ -n "${{ secrets.SCORE_QNX_LICENSE }}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  coverage-qnx:
    name: Build & Test (QNX, --config=qnx)
    needs: [determine-qnx]
    if: inputs.fetch-only != 'true' && needs.determine-qnx.outputs.available == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup QNX and QEMU environment
        uses: ./.github/actions/00_infrastructure/setup_qnx_environment
        with:
          qnx-license: ${{ secrets.SCORE_QNX_LICENSE }}

      - uses: ./.github/actions/00_infrastructure/prepare_bazel_environment
        with:
          disk-cache: ""
          cache-mode: ${{ inputs.cache-mode }}
          ubuntu-snapshot-mirror-url: ${{ secrets.UBUNTU_SNAPSHOT_MIRROR_URL }}

      - name: Run coverage (QNX, --config=qnx)
        id: run-coverage-qnx
        env:
          SCORE_QNX_USER: ${{ secrets.SCORE_QNX_USER }}
          SCORE_QNX_PASSWORD: ${{ secrets.SCORE_QNX_PASSWORD }}
        run: bazel coverage --config=ci --config=qnx //score/... --build_tests_only

      - name: Generate coverage report (QNX)
        if: steps.run-coverage-qnx.outcome == 'success'
        id: generate-report-qnx
        env:
          # Report-only: the effective-coverage gate is not enforced yet.
          COVERAGE_THRESHOLD: "0"
        run: |
          # Note: no --config=qnx here. This step only reads the coverage
          # data produced by the previous "bazel coverage" step and runs a
          # host-side Python tool; --config=qnx sets the *target* platform to
          # QNX for the whole invocation, and no Python toolchain is
          # registered for that platform, so the build fails to resolve one.
          bazel run --config=ci @score_coverage//:generate_coverage_html -- \
            --platform qnx \
            --yaml quality/coverage/coverage_justifications.yaml \
            --testlogs-subdir score \
            --archive "${{ github.event.repository.name }}_coverage_report_qnx_${{ github.sha }}" \
            cpp_coverage_qnx

      - name: Upload coverage artifacts (QNX)
        if: steps.generate-report-qnx.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}_coverage_report_qnx_${{ github.sha }}
          path: ${{ github.event.repository.name }}_coverage_report_qnx_${{ github.sha }}.zip
