      - uid: //score/someip/routing_module/RoutingManagerTest:RemovesAllRoutingStateWhenTheDaemonDisconnects
        given: a connected SD daemon with two queued routing commands
        when: the daemon disconnects without announcing its shutdown and the pending commands are processed
        then: the queued commands are discarded and all routing state is removed
  - id: RoutingModule.CR_RoutingModule_ControllerShutdown
    version: '1'
    description: The router shall remove its complete routing state when the controller announces its shutdown, and shall log an announced shutdown differently from an unexpected disconnect.
    test_cases:
