      - uid: //score/someip/routing_module/RoutingManagerTest:CommandsOfReconnectedDaemonFollowTheRemoval
        given: an SD daemon that disconnected and reconnected before the pending commands are processed
        when: the reconnected daemon sends a routing command and the pending commands are processed
        then: all routing state is removed before the new command is applied
      - uid: //score/someip/routing_module/RoutingManagerTest:ReconnectDuringProcessingKeepsRemovalBeforeNewCommands
        given: pending commands being processed, while the SD daemon disconnects, reconnects and sends a new command during the processing of the first command
