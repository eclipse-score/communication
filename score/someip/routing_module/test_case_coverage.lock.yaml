requirements:
- id: RoutingModule.CR_RoutingModule_AddLocalService
  version: '1'
  description: The routing module shall start sending a local service's event notifications
    to the network when the controller registers that service.
  test_cases: []
- id: RoutingModule.CR_RoutingModule_AddRemoteService
  version: '1'
  description: The routing module shall install a receive path for a valid remote
    service supplied by the controller.
  test_cases: []
- id: RoutingModule.CR_RoutingModule_ConcatenatedMessages
  version: '1'
  description: The routing module shall process complete concatenated SOME/IP notifications
    in a UDP datagram.
  test_cases:
  - uid: //score/someip/routing_module/SomeipDatagramParserTest:ParsesConcatenatedNotifications
    given: a UDP datagram with two concatenated notifications and different payload
      sizes
    when: the datagram is iterated
    then: both notification headers and payload offsets are returned in order, then
      iteration ends
- id: RoutingModule.CR_RoutingModule_ControlInterface
  version: '1'
  description: The routing module shall change its routing state only in response
    to routing commands received from the external controller through score::message_passing.
  test_cases:
  - uid: //score/someip/routing_module/RoutingManagerMessagePassingTest:AppliesCommandsReceivedOverMessagePassing
    given: a started routing manager and an SD daemon client using score::message_passing
    when: the client sends two routing commands, the commands are processed, and the
      client then disconnects
    then: both commands are applied in order, and all routing state is removed after
      the disconnect
  - uid: //score/someip/routing_module/RoutingManagerTest:DispatchesEveryRoutingCommandToTheHandler
    given: a connected SD daemon
    when: it sends one routing command of each opcode and the pending commands are
      processed
    then: each command is passed with its parameters to the matching routing command
      handler operation
  - uid: //score/someip/routing_module/RoutingManagerTest:RejectsCommandsThatRequestAReply
    given: a connected SD daemon
    when: it sends a valid routing command as a request with reply
    then: the request is rejected and no command is applied
  - uid: //score/someip/routing_module/RoutingManagerTest:StartFailsWhenListeningFails
    given: a routing command server that cannot listen
    when: the routing manager is started
    then: starting fails with the server's error
  - uid: //score/someip/routing_module/RoutingManagerTest:StartsRoutingCommandServer
    given: a routing manager
    when: it is started
    then: it listens on the routing control protocol service identifier for routing
      commands
  - uid: //score/someip/routing_module/RoutingManagerTest:StopStopsListening
    given: a started routing manager
    when: it is stopped
    then: it stops listening for routing commands
- id: RoutingModule.CR_RoutingModule_ControlOrdering
  version: '1'
  description: The routing module shall apply queued routing updates in arrival order
    before forwarding subsequent samples.
  test_cases:
  - uid: //score/someip/routing_module/RoutingManagerMessagePassingTest:AppliesCommandsReceivedOverMessagePassing
    given: a started routing manager and an SD daemon client using score::message_passing
    when: the client sends two routing commands, the commands are processed, and the
      client then disconnects
    then: both commands are applied in order, and all routing state is removed after
      the disconnect
  - uid: //score/someip/routing_module/RoutingManagerTest:AppliesCommandsOnlyWhenProcessedInArrivalOrder
    given: a connected SD daemon that sends three routing commands
    when: the commands arrive, the wakeup is signaled and the pending commands are
      processed
    then: no command is applied before processing, and processing applies them in
      arrival order
  - uid: //score/someip/routing_module/RoutingManagerTest:CommandsOfReconnectedDaemonFollowTheRemoval
    given: an SD daemon that disconnected and reconnected before the pending commands
      are processed
    when: the reconnected daemon sends a routing command and the pending commands
      are processed
    then: all routing state is removed before the new command is applied
  - uid: //score/someip/routing_module/RoutingManagerTest:ReconnectDuringProcessingKeepsRemovalBeforeNewCommands
    given: pending commands being processed, while the SD daemon disconnects, reconnects
      and sends a new command during the processing of the first command
    when: processing continues
    then: the remaining old command is discarded, and all routing state is removed
      before the new command is applied
- id: RoutingModule.CR_RoutingModule_ControlQueueOverflow
  version: '1'
  description: The routing module shall discard and log routing commands received
    while its bounded routing-command queue is full, without blocking the controller
    connection.
  test_cases:
  - uid: //score/someip/routing_module/RoutingManagerTest:DiscardsCommandsWhileTheQueueIsFull
    given: a connected SD daemon and a command queue that is not processed
    when: the daemon sends three routing commands more than the queue holds, and one
      more after processing
    then: the three surplus commands are discarded without error to the connection,
      all others are applied
- id: RoutingModule.CR_RoutingModule_ControllerLoss
  version: '1'
  description: The routing module shall remove its complete routing state when the
