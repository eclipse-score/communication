  - id: RouterControlProtocol.CR_RouterControlProtocol_BufferBounds
    version: '1'
    description: The router control protocol shall report an error instead of writing an encoded routing command into a buffer that is too small for it.
    test_cases:
      - uid: //score/someip/router_control_protocol/RouterControlProtocolTest:EncodeFitsExactBuffer
