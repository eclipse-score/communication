#
# Coverage Justification Database
# ================================
#
# This file defines justified non-covered lines for achieving 100% effective coverage.
#
# Each justification has:
#   - id: Unique kebab-case identifier
#   - category: One of: defensive_programming, tool_false_positive, platform_specific, other
#   - reason: Explanation why the line(s) cannot be covered
#   - platforms: (optional) List of platforms this justification applies to: [linux], [qnx], or [linux, qnx]
#               When omitted, the justification applies to all platforms.
#   - locations: (optional) File + line specifications where justification applies
#
# Lines can also be justified via in-code markers referencing the ID:
#   // COV_JUSTIFIED <id>           — justifies the current line
#   // COV_JUSTIFIED_START <id>     — starts a justified region
#   // COV_JUSTIFIED_STOP           — ends the justified region
#
# Validation rules:
#   - IDs must be unique and kebab-case (lowercase + hyphens)
#   - Every justification needs a non-empty reason
#   - Stale justifications (line is actually covered) produce warnings
#   - References to non-existent IDs produce errors
#

version: 1

justifications:
  # Example entries (uncomment and adapt as needed):
  #
  # - id: config-parser-defensive-switch
  #   category: defensive_programming
  #   reason: >
  #     Default case in switch over fully-handled enum. All enum values are explicitly
  #     handled with a static_assert guard. Kept as defensive programming against
  #     future enum additions.
  #   locations:
  #     - file: score/mw/com/impl/configuration/config_parser.cpp
  #       line_start: 1201
  #       line_end: 1203
  #
  # - id: runtime-tool-false-positive
  #   category: tool_false_positive
  #   platforms: [linux]  # only applies to Linux coverage
  #   reason: >
  #     Coverage tool incorrectly marks this line as not covered. Lines immediately
  #     before and after are covered, indicating a tool bug.
  #   locations:
  #     - file: score/mw/com/impl/runtime.cpp
  #       lines: [191]
  #
  - id: flag-file-crawler-defensive
    category: defensive_programming
    platforms: [linux, qnx] # applies to both platforms
    reason: >
      Defensive guard for flag file parsing. Only entered if a flag file exists,
      so the file must be parseable. Guard protects against filesystem race conditions.
    locations:
      - file: score/mw/com/impl/generic_skeleton_event.cpp
        line_start: 29
        line_end: 29

  - id: generic-skeleton-event-emplace-failure-unreachable
    category: defensive_programming
    platforms: [linux, qnx]
    reason: >
      Defensive programming: emplace() into the events map can only fail if the key already exists.
      Duplicate event names are rejected earlier in GenericSkeleton::Create() (kServiceElementAlreadyExists),
      and stable_name is the configuration key found for exactly that (already unique) event name.
      Therefore the emplace can never fail at this point.

  - id: runtime-config-parser-guarantees-service-type
    category: defensive_programming
    platforms: [linux, qnx]
    reason: >
      This branch is defensive only. Configuration::Validate() invokes
      Configuration::CrossCheckServiceInstancesToTypes()
      (score/mw/com/impl/configuration/configuration.cpp), which ensures that every
      configured service instance references an existing service type. Therefore,
      GetServiceTypeDeployment() finds a deployment for every matching service
      instance in a validated configuration. Runtime::Initialize() and
      Runtime::MergeAdditionalConfiguration() validate configurations and treat
      validation failures as fatal. However, Runtime::getInstanceInternal() can
      lazily parse the default configuration without calling Validate(). This check
      is retained to protect that unvalidated path.

  - id: gateway-clear-nonblock-on-accepted-socket
    platforms: [linux, qnx]
    category: defensive_programming
    reason: >
      Defensive programming: Posix system call can only go wrong if the socket file descriptor is invalid,
      but socket has just been accepted in an earlier step.

  - id: gateway-handle-response-only-ack-response
    platforms: [linux, qnx]
    category: defensive_programming
    reason: >
      Defensive programming: Type has already been checked before this function has been called.

  - id: gateway-dispatch-loop-calls-handler
    platforms: [linux, qnx]
    category: tool_false_positive
    reason: >
      Coverage tool incorrectly marks this line as not covered. Lines immediately before and after are covered.
      Covered by the test BidirectionalTransportSocketFixture.DispatchThreadDeliversQueuedMessageToHandler
      inside score/mw/com/gateway/transport_layer/sample/bidirectional_transport_test.cpp

  - id: ivshmem-bind-shm-to-bar-shm-ctl-special-success
    category: defensive_programming
    platforms: [qnx]
    reason: >
      QNX x86_64 only: shm_ctl_special() needs a real ivshmem device and WB-backed shared memory,
      so the mock-fd test path always hits EBADF. Fallback to standard shm_ctl() on failure.
    locations:
      - file: score/mw/com/gateway/transport_layer/qemu/ivshmem/ivshmem_typed_memory_provider.cpp
        line_start: 321
        line_end: 329

  - id: ivshmem-write-directory-entry-idempotent
    category: defensive_programming
    platforms: [qnx]
    reason: >
      Idempotent guard in WriteDirectoryEntry() requires multi-VM concurrent write race;
      single-process tests cache allocations on first write, preventing re-entry.
    locations:
      - file: score/mw/com/gateway/transport_layer/qemu/ivshmem/ivshmem_typed_memory_provider.cpp
        line_start: 222
        line_end: 230

  - id: ivshmem-bar-discovery-hardware-path
    category: defensive_programming
    platforms: [qnx]
    reason: >
      QNX PCI API calls require real ivshmem device. Tests with no hardware hit pci_device_find→PCI_BDF_NONE
      and cannot mock PCI subsystem APIs.
    locations:
      - file: score/mw/com/gateway/transport_layer/qemu/ivshmem/ivshmem_bar_discovery.cpp
        line_start: 45
        line_end: 133

  - id: qemu-worldwritable-ctor-gcc-artifact
    category: defensive_programming
    platforms: [qnx]
    reason: >
      GCC/GCOV x86_64 QNX emits separate counter for WorldWritable{} on continuation lines;
      QCC omits sequence-point counter on trivial temporaries.
    locations:
      - file: score/mw/com/gateway/transport_layer/qemu/qemu_hypervisor_transport.cpp
        line_start: 356
        line_end: 357

  - id: handle-type-hash-buffer-size-assert
    category: defensive_programming
    platforms: [linux, qnx]
    reason: >
      ToHashString() always returns a fixed-length string of constexpr size, independent of the id values.
      So the assertion gives the same result on every call (per compilation), and any test that hashes a
      HandleType proves it never fails.

  - id: reference-to-moveable-make-unique-nonnull-assert
    category: defensive_programming
    platforms: [linux, qnx]
    reason: >
      std::make_unique never returns nullptr (it throws std::bad_alloc on allocation failure),
      so reference_to_moveable_ is always non-null. The assert-failure path is unreachable.

  - id: sample-allocatee-tracker-deallocate-underflow-assert
    category: defensive_programming
    platforms: [linux, qnx]
    reason: >
      Defensive underflow check in SampleAllocateeTracker::Deallocate(). Deallocate() is only
      called via a SampleAllocateeGuard, which is handed out by Allocate() (which first does
      fetch_add) and deallocates at most once. Thus the pre-decrement value 'previous' is always
      greater than 0, making the assert-failure path unreachable without violating the guard's
      allocate/deallocate pairing.

  - id: sample-reference-tracker-available-samples-assert
    category: defensive_programming
    platforms: [linux, qnx]
    reason: >-
      Available_samples_ starts at max_num_samples_ and every deallocation only gives back
      samples that were previously taken out, so it can never grow above max_num_samples_.
      The assert-failure path is therefore unreachable.
