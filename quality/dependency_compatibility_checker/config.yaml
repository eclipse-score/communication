# Single source of truth for the dependency compatibility matrix.
# Each version entry may carry its own patches/flags, applied whenever it is selected.
# Disable a version by adding `skip: "<reason with ticket>"` (keep it for traceability).
dependencies:
  bazel:                       # special: drives USE_BAZEL_VERSION, not a MODULE dep
    versions:
      - version: "8.5.1"
      - version: "8.6.0"
      - version: "8.7.0"
      - version: "9.0.2"
        skip: "https://github.com/eclipse-score/communication/issues/694"
  rules_cc:
    versions:
      - version: "0.2.17"
      - version: "0.2.22"
  rules_python:
    versions:
      - version: "1.8.5"
      - version: "1.9.1"
      - version: "2.0.3"
        skip: "https://github.com/eclipse-score/communication/issues/695"
      - version: "2.1.0"
        skip: "https://github.com/eclipse-score/communication/issues/695"
      - version: "2.2.0"
        skip: "https://github.com/eclipse-score/communication/issues/695"
  rules_rust:
    versions:
      - version: "0.68.1-score"
