deviations:
  - rule-id: "RULE-18-5-2"
    query-id: "cpp/misra/avoid-program-terminating-functions"
    justification: "The software is designed for a fail-silent system. The agreed safe-state for a process is the termination. Thus, we do not need to care about not cleaning up the environment, as this is exactly the desired behavior."
    paths:
      - "score/**"
  - rule-id: "RULE-6-8-3"
    query-id: "cpp/misra/automatic-storage-assigned-to-object-greater-lifetime"
    code-identifier: "unix-domain-iovec-stack-buffers"
    scope: "Applies only to the specific `iovec::iov_base` assignments marked with this code identifier in score/message_passing/unix_domain/unix_domain_engine.cpp. This code-identifier must not be used anywhere else in the codebase."
    justification: "These assignments store the address of automatic-storage buffers (function parameters/locals) into the `iov_base` field of `iovec` array elements that are themselves automatic-storage variables of the very same function scope. The `iovec` array is only ever read synchronously by the immediately following `sendmsg`/`recvmsg` POSIX syscall, before the function returns and any of the referenced objects go out of scope; no pointer escapes the function and no dangling reference is ever created. This is the standard, idiomatic scatter/gather I/O pattern for `sendmsg`/`recvmsg`, and the tool's scope-based heuristic cannot see that the `iovec` array's lifetime never outlives the objects it points to."
  - rule-id: "RULE-6-8-3"
    query-id: "cpp/misra/automatic-storage-assigned-to-object-greater-lifetime"
    code-identifier: "timed-command-queue-owner-tag"
    scope: "Applies only to the specific `owner_` assignment marked with this code identifier in score/message_passing/timed_command_queue.cpp. This code-identifier must not be used anywhere else in the codebase."
    justification: "`owner` is stored purely as an opaque identity/comparison key, as documented on `TimedCommandQueue::RegisterTimedEntry`/`RegisterImmediateEntry`/`CleanUpOwner` in timed_command_queue.h: 'the address of an object responsible for the lifetimes of the queue entry objects'. The pointer is never dereferenced by the queue; it is only ever compared for equality in `CleanUpOwner()`, which callers are required to invoke (or otherwise guarantee the referenced entries are removed) before the owner object's lifetime ends. Comparing a stored pointer value therefore cannot cause undefined behaviour even if used after the pointee's lifetime, unlike the read-after-free scenario this rule targets."
  - rule-id: "RULE-21-6-3"
    query-id: "cpp/misra/advanced-memory-management-used"
    code-identifier: "shared-memory-placement-new"
    scope: "Applies only to the specific placement-new expressions marked with this code identifier in score/memory/shared/managed_memory_resource.h and score/memory/shared/shared_memory_resource.cpp. This code-identifier must not be used anywhere else in the codebase."
    justification: "These marked placement-new expressions are part of the shared-memory allocator abstraction layer and must construct objects at a caller-supplied, already-allocated address (e.g. a page mapped via mmap or a slot from a custom memory resource). This requires placement new, i.e. the non-replaceable `operator new(std::size_t, void*)`. The raw new/delete usage is intentionally confined to these two call sites in the abstraction layer so that the rest of the codebase does not need to use advanced memory management directly."
  - rule-id: "RULE-8-2-3"
    query-id: "cpp/misra/cast-removes-const-or-volatile-from-pointer-or-reference"
    code-identifier: "shared-memory-align-const-cast"
    scope: "Applies only to the specific const_cast marked with this code identifier in score/memory/shared/shared_memory_resource.cpp. This code-identifier must not be used anywhere else in the codebase."
    justification: "`do_allocation_algorithm` uses `std::align`, whose `void*&` out-parameter cannot bind to the `const void*` input pointer. `std::align` only reads and arithmetically adjusts the pointer value to compute an aligned address within the given buffer; it never writes through the pointer to modify the pointee (https://timsong-cpp.github.io/cppwp/n4659/ptr.align#lib:align). The const qualification of `alloc_start` is therefore not violated at runtime, and the `const_cast` is required purely to satisfy `std::align`'s non-const parameter type."
